<!doctype html><html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Your account | Fynrec Payment Check</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/css/payment-check.css"><script src="/components.js" defer></script><script src="/js/payment-api.js" defer></script><script src="/js/payment-account.js" defer></script></head><body class="payment-check"><div id="site-nav"></div><main class="container profile-section"><a href="/payment-check/">← Payment Check</a><span class="eyebrow">Your Payment Check account</span><h1>Sign in or create an account.</h1><p id="account-status" role="status"></p>
<section id="auth-forms" class="account-grid">
<form class="pc-form" method="POST" action="/api/payment/login" id="login"><h2>Sign in</h2><label>Work email<input type="email" name="email" required autocomplete="username" maxlength="254"></label><label>Password<input name="password" type="password" required autocomplete="current-password" maxlength="128"></label><button class="btn-primary" type="submit">Sign in</button><p class="form-status" role="status"></p></form>
<form class="pc-form" method="POST" action="/api/payment/signup" id="signup"><h2>Create an account</h2><label>Your business name<input name="business" required minlength="2" maxlength="160" autocomplete="organization"></label><label>Work email<input name="email" type="email" required autocomplete="username" maxlength="254"></label><label>Password <span class="muted">(at least 12 characters)</span><input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><label class="checkbox-field"><input name="terms" type="checkbox" required><span>I agree to the <a href="/payment-check/account-terms/">account terms</a> and have read <a href="/payment-check/privacy/">how my information is used</a>.</span></label><button class="btn-primary" type="submit">Create account</button><p class="form-status" role="status"></p></form>
<form class="pc-form" method="POST" action="/api/payment/recover" id="recover"><h2>Forgot your password?</h2><label>Account email<input name="email" type="email" required maxlength="254" autocomplete="email"></label><button class="btn-primary" type="submit">Email a recovery code</button><p class="form-status" role="status"></p></form>
<form class="pc-form" method="POST" action="/api/payment/recovery-session" id="recovery-session"><h2>Enter your recovery code</h2><label>Account email<input name="email" type="email" required maxlength="254" autocomplete="email"></label><label>Code from your email<input name="code" required inputmode="numeric" pattern="[0-9]{6,10}" autocomplete="one-time-code"></label><button class="btn-primary" type="submit">Verify code</button><p class="form-status" role="status"></p></form>
</section>
<form class="pc-form" method="POST" action="/api/payment/password" id="password" hidden><h2>Choose a new password</h2><label>New password<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><button class="btn-primary" type="submit">Update password</button><p class="form-status" role="status"></p></form>
<section id="my-account" hidden><div class="share-actions"><a class="btn-primary" href="/payment-check/#share">Submit a payment report</a><a id="admin-link" href="/payment-check/admin/" hidden>Moderation dashboard →</a><button type="button" class="text-button" id="logout">Sign out</button></div><h2>Your submissions</h2><div id="my-reports"></div><div class="share-actions"><button type="button" class="text-button" id="previous-reports">← Newer</button><button type="button" class="text-button" id="next-reports">Older →</button></div></section></main><div id="site-footer"></div></body></html>
